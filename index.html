<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Device</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        
        .card-bg {
            background: linear-gradient(180deg, #07130c 0%, #040a06 100%);
            border: 1px solid #11281a;
        }

        .device-card {
            background: linear-gradient(180deg, #0a1f13 0%, #040d07 100%);
            border: 1px solid #1a4228;
            transition: all 0.3s ease;
        }
        .device-card:hover, .device-card:active {
            border-color: #38d372;
            box-shadow: 0 0 25px rgba(56, 211, 114, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- DEVICE SELECTION CONTAINER -->
    <div class="w-full max-w-sm card-bg rounded-[2.5rem] p-7 text-center border border-[#163a23] shadow-[0_0_50px_rgba(0,0,0,0.9)] flex flex-col items-center">
        
        <!-- Icon Badge -->
        <div class="w-16 h-16 rounded-2xl bg-[#081a0f] border border-[#153e24] flex items-center justify-center mb-5 text-[#38d372] shadow-[0_0_20px_rgba(56,211,114,0.2)]">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-black text-white tracking-tight mb-2">
            What device do you use?
        </h2>
        <p class="text-xs text-gray-400 font-medium mb-6 leading-relaxed">
            Select your operating system to continue
        </p>

        <!-- Buttons -->
        <div class="w-full space-y-3.5 mb-2">
            <!-- iOS Button -->
            <button onclick="redirectDevice('iOS')" class="device-card w-full p-4 rounded-2xl flex items-center justify-between group cursor-pointer">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 rounded-xl bg-[#0f2d1b] border border-[#1e5230] flex items-center justify-center text-white group-hover:text-[#38d372] transition-colors">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.13c.63-.77 1.06-1.85.94-2.93-.92.04-2.05.62-2.71 1.39-.59.68-1.11 1.78-.97 2.84 1.03.08 2.11-.53 2.74-1.3"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-sm font-extrabold text-white group-hover:text-[#38d372] transition-colors">iOS / iPhone</div>
                        <div class="text-[10px] text-gray-400 font-medium">Apple App Store</div>
                    </div>
                </div>
                <span class="text-[#38d372] font-extrabold text-sm opacity-80 group-hover:opacity-100 transition-opacity">→</span>
            </button>

            <!-- Android Button -->
            <button onclick="redirectDevice('Android')" class="device-card w-full p-4 rounded-2xl flex items-center justify-between group cursor-pointer">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 rounded-xl bg-[#0f2d1b] border border-[#1e5230] flex items-center justify-center text-white group-hover:text-[#38d372] transition-colors">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M17.523 15.341a.996.996 0 00-.996.996v2.324a.996.996 0 101.992 0v-2.324a.996.996 0 00-.996-.996zM6.477 15.341a.996.996 0 00-.996.996v2.324a.996.996 0 101.992 0v-2.324a.996.996 0 00-.996-.996zM15.97 9.878l1.458-2.525a.437.437 0 10-.757-.437l-1.488 2.576a8.874 8.874 0 00-6.366 0L7.329 6.916a.437.437 0 10-.757.437l1.458 2.525C4.78 11.238 2.5 14.502 2.5 18.25h19c0-3.748-2.28-7.012-5.53-8.372zM8.5 14.25a.75.75 0 110-1.5.75.75 0 010 1.5zm7 0a.75.75 0 110-1.5.75.75 0 010 1.5z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-sm font-extrabold text-white group-hover:text-[#38d372] transition-colors">Android</div>
                        <div class="text-[10px] text-gray-400 font-medium">Google Play Store</div>
                    </div>
                </div>
                <span class="text-[#38d372] font-extrabold text-sm opacity-80 group-hover:opacity-100 transition-opacity">→</span>
            </button>
        </div>

        <div class="flex items-center gap-1.5 text-[10px] text-gray-500 mt-2 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-[#38d372]"></span>
            Loading optimized version
        </div>
    </div>

    <!-- REDIRECTION LOGIC -->
    <script>
        function redirectDevice(device) {
            // Înlocuiește aceste URL-uri cu adresele tale valide
            const iosUrl = "https://freecash2.pages.dev/";
            const androidUrl = "https://freecash2.pages.dev/";

            let targetUrl = (device === 'iOS') ? iosUrl : androidUrl;

            // Păstrează parametrii de urmărire din URL (ex: utm_source, subid)
            const currentParams = window.location.search;
            if (currentParams && targetUrl) {
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + currentParams.substring(1);
            }

            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
